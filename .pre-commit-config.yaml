repos:
  # General file hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '(^|.*/)(charts/.*/templates|services/.*/chart/templates)/.*\.ya?ml$'
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # YAML and Markdown formatting.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.7.4
    hooks:
      - id: prettier
        types_or: [yaml, markdown]
        exclude: '(^|.*/)(charts/.*/templates|services/.*/chart/templates)/.*\.ya?ml$'

  # Python formatting and linting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # SQL / dbt.
      - id: sqlfluff-fix
        name: sqlfluff fix (dbt models)
        entry: env -u VIRTUAL_ENV apps/dbt/.venv/bin/sqlfluff fix --config apps/dbt/pyproject.toml apps/dbt/models
        language: system
        files: ^apps/dbt/models/.*\.sql$
        pass_filenames: false
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt models)
        entry: env -u VIRTUAL_ENV apps/dbt/.venv/bin/sqlfluff lint --config apps/dbt/pyproject.toml apps/dbt/models
        language: system
        files: ^apps/dbt/models/.*\.sql$
        pass_filenames: false
      - id: generate-dbt-source-schema
        name: generate dbt source schema (Django contract changes)
        entry: make generate-dbt-source-schema
        language: system
        files: ^apps/django/(src/.*/migrations/.*\.py|schema/source\.sql)$
        pass_filenames: false
        stages: [pre-push]

      # Python type checking.
      - id: ty
        name: ty (changed apps)
        entry: bash scripts/pre-commit-ty.sh
        language: system
        files: ^apps/(api|django|mcp|runner)/
        pass_filenames: true
        require_serial: true
      # TypeScript / Node.js.
      - id: node-quality
        name: node quality (changed ts apps)
        entry: bash scripts/pre-commit-node-quality.sh
        language: system
        files: ^apps/[^/]+/(src/.*\.(ts|tsx)|package(-lock)?\.json|tsconfig\.json)$
        pass_filenames: true
        require_serial: true

      # Go formatting, tests, and static analysis.
      - id: gofmt
        name: gofmt (tools)
        entry: gofmt -w
        language: system
        files: ^apps/tools/.*\.go$
      - id: go-deadcode
        name: deadcode (tools)
        entry: bash scripts/pre-commit-go-quality.sh deadcode
        language: system
        files: ^apps/tools/.*\.go$
        pass_filenames: false
        require_serial: true
      - id: go-golint
        name: golint (tools)
        entry: bash scripts/pre-commit-go-quality.sh golint
        language: system
        files: ^apps/tools/.*\.go$
        pass_filenames: false
        require_serial: true

      # Repository validation.
      - id: agentslint
        name: agentslint
        entry: agentslint check .
        language: python
        additional_dependencies: [agentslint==0.1.0]
        pass_filenames: false
        always_run: true
      # TODO(talos): Add a `make talos-validate` system hook after the node inventory is complete,
      # generated configs exist, and talosctl v1.13 is available to the hook locally and in CI.
      - id: validate-fast
        name: make validate-fast
        entry: make validate-fast
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: validate
        name: make validate
        entry: make validate
        language: system
        pass_filenames: false
        stages: [pre-push]
