repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '(^|.*/)(charts/.*/templates|services/.*/chart/templates)/.*\.ya?ml$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.7.4
    hooks:
      - id: prettier
        types_or: [yaml, markdown]
        exclude: '(^|.*/)(charts/.*/templates|services/.*/chart/templates)/.*\.ya?ml$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: sqlfluff-fix
        name: sqlfluff fix (dbt models)
        entry: env -u VIRTUAL_ENV apps/dbt/.venv/bin/sqlfluff fix --config apps/dbt/pyproject.toml apps/dbt/models
        language: system
        files: ^apps/dbt/models/.*\.sql$
        pass_filenames: false
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt models)
        entry: env -u VIRTUAL_ENV apps/dbt/.venv/bin/sqlfluff lint --config apps/dbt/pyproject.toml apps/dbt/models
        language: system
        files: ^apps/dbt/models/.*\.sql$
        pass_filenames: false
      - id: ty
        name: ty (changed apps)
        entry: bash scripts/pre-commit-ty.sh
        language: system
        files: ^apps/(api|django|runner)/
        pass_filenames: true
        require_serial: true
      - id: node-quality
        name: node quality (changed ts apps)
        entry: bash scripts/pre-commit-node-quality.sh
        language: system
        files: ^apps/[^/]+/(src/.*\.(ts|tsx)|package(-lock)?\.json|tsconfig\.json)$
        pass_filenames: true
        require_serial: true
      - id: validate-fast
        name: make validate-fast
        entry: make validate-fast
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: validate
        name: make validate
        entry: make validate
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: generate-dbt-source-schema
        name: generate dbt source schema (Django contract changes)
        entry: make generate-dbt-source-schema
        language: system
        files: ^apps/django/(src/.*/migrations/.*\.py|schema/source\.sql)$
        pass_filenames: false
        stages: [pre-push]
