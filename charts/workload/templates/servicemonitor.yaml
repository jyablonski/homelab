{{- if and .Values.deployment.enabled .Values.serviceMonitor.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "serviceMonitor.enabled requires service.enabled" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "workload.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "workload.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ default .Values.portName .Values.serviceMonitor.port }}
      path: {{ .Values.serviceMonitor.path | quote }}
      scheme: {{ .Values.serviceMonitor.scheme | quote }}
      interval: {{ .Values.serviceMonitor.interval | quote }}
      {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . | quote }}
      {{- end }}
      relabelings:
        # Same `app` label Alloy puts on Loki streams, so one dashboard variable
        # filters both metrics and logs.
        - sourceLabels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          targetLabel: app
        {{- with .Values.serviceMonitor.relabelings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
