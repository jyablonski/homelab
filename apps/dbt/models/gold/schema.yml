version: 2

models:
  - name: events_obt
    description: Agenda-ready one-big-table projection of all normalized sports events.
    columns:
      - name: id
        description: Stable identifier namespaced by event source.
        data_tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9a-f]{32}$"
      - name: source
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: [nba, cs2, ufc]
      - name: category
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: [sports]
      - name: league
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: [NBA, CS2, UFC]
      - name: title
        data_tests: [not_null]
      - name: start_at
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'2020-01-01'::timestamptz"
      - name: status
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set:
                  [scheduled, in_progress, completed, postponed, cancelled]
      - name: metadata
        data_tests: [not_null]
