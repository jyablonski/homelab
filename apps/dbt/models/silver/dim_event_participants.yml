version: 2

models:
  - name: dim_event_participants
    description: Deduplicated teams and fighters appearing in event feeds.
    columns:
      - name: participant_id
        data_tests:
          - not_null
          - unique
      - name: event_source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_sources')
                field: event_source_id
      - name: participant_name
        data_tests:
          - not_null
      - name: participant_type
        data_tests:
          - not_null
