version: 2

models:
  - name: dim_event_sources
    description: Canonical event source, category, and league attributes.
    columns:
      - name: event_source_id
        data_tests: [not_null, unique]
      - name: event_source
        data_tests: [not_null, unique]
      - name: source_name
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
      - name: league
        data_tests: [not_null]

  - name: dim_event_participants
    description: Deduplicated teams and fighters appearing in event feeds.
    columns:
      - name: participant_id
        data_tests: [not_null, unique]
      - name: event_source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_sources')
                field: event_source_id
      - name: participant_name
        data_tests: [not_null]
      - name: participant_type
        data_tests: [not_null]

  - name: fct_events
    description: One standardized and deduplicated row per source event.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: event_source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_sources')
                field: event_source_id
      - name: source_event_id
        data_tests: [not_null]
      - name: event_source
        data_tests: [not_null]
      - name: event_title
        data_tests: [not_null]
      - name: starts_at
        data_tests: [not_null]
      - name: event_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [scheduled, in_progress, completed, postponed, cancelled]

  - name: fct_event_participants
    description: Deduplicated event-to-participant relationships and source roles.
    data_tests:
      - unique:
          arguments:
            column_name: "event_id || ':' || participant_id"
    columns:
      - name: event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_events')
                field: event_id
      - name: participant_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_participants')
                field: participant_id
      - name: participant_role
        data_tests: [not_null]
