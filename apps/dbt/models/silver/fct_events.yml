version: 2

models:
  - name: fct_events
    description: One standardized and deduplicated row per source event.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: event_source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_event_sources')
                field: event_source_id
      - name: source_event_id
        data_tests:
          - not_null
      - name: event_source
        data_tests:
          - not_null
      - name: event_title
        data_tests:
          - not_null
      - name: starts_at
        data_tests:
          - not_null
      - name: event_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - scheduled
                  - in_progress
                  - completed
                  - postponed
                  - cancelled
