version: 2

sources:
  - name: bronze
    description: Raw landing tables populated by ingestion pipelines in the source schema.
    schema: source
    loaded_at_field: modified_at
    freshness:
      warn_after: { count: 30, period: hour }
      error_after: { count: 54, period: hour }
    tables:
      - name: events_nba
        columns:
          - name: source_event_id
            data_tests: [not_null]
          - name: event_start
            data_tests: [not_null]

      - name: events_cs
        columns:
          - name: source_event_id
            data_tests: [not_null]
          - name: event_start
            data_tests: [not_null]

      - name: events_ufc
        columns:
          - name: source_event_id
            data_tests: [not_null]
          - name: event_start
            data_tests: [not_null]

      - name: events_ufc_fighters
        # Fighters land together with their events_ufc rows, so events_ufc
        # freshness already covers this table.
        freshness: null
        columns:
          - name: source_event_id
            data_tests: [not_null]
          - name: fighter_id
            data_tests: [not_null]
