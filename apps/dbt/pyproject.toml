[project]
name = "homelab-dbt"
version = "0.1.0"
description = "dbt transformations for the homelab data platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "dbt-core==1.11.12",
  "dbt-postgres==1.10.2",
]

[dependency-groups]
dev = [
  "sqlfluff==4.2.2",
  "sqlfluff-templater-dbt==4.2.2",
]

[tool.uv]
package = false

[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
max_line_length = 100
exclude_rules = "ST06"

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true
load_macros_from_path = "macros"
