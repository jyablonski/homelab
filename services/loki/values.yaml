loki:
  auth_enabled: false
  # delete logs after 7 days
  limits_config:
    retention_period: 168h
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  # The ruler evaluates LogQL alert rules from services/loki/rules/ (loaded by
  # the rules sidecar into /rules/<tenant>; "fake" is the single tenant when
  # auth_enabled is false) and sends alerts to kube-prometheus-stack's
  # Alertmanager. If alertmanager.enabled is false there, rules still evaluate
  # but notifications fail and are only logged.
  rulerConfig:
    wal:
      dir: /var/loki/ruler-wal
    storage:
      type: local
      local:
        directory: /rules
    rule_path: /var/loki/rules-temp
    alertmanager_url: http://prometheus-operator-kube-p-alertmanager.monitoring.svc.cluster.local:9093
    external_url: http://grafana.home/explore
    enable_api: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi

gateway:
  enabled: true

sidecar:
  rules:
    label: loki_rule
    labelValue: "1"
    folder: /rules/fake

# Disable minio - using filesystem
minio:
  enabled: false

# Zero out other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
