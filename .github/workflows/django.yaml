name: Django CI

on:
  push:
    branches: [main]
    paths:
      - "apps/django/**"
      - "scripts/dump-django-source-schema.sh"
      - ".github/workflows/django.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/django/**"
      - "scripts/dump-django-source-schema.sh"
      - ".github/workflows/django.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.7"
  PYTHON_VERSION: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest
    name: Django tests

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/django/uv.lock

      - name: Install dependencies
        working-directory: apps/django
        run: uv sync --locked --dev

      - name: Run test suite
        working-directory: apps/django
        run: uv run pytest

  schema-contract:
    runs-on: ubuntu-latest
    name: Source schema contract
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/django/uv.lock

      - name: Install dependencies
        working-directory: apps/django
        run: uv sync --locked

      - name: Apply migrations
        working-directory: apps/django
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          DB_SEARCH_PATH: source,public
        run: uv run python src/manage.py migrate --noinput

      - name: Verify source schema contract
        env:
          PG_DUMP_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash scripts/dump-django-source-schema.sh "${RUNNER_TEMP}/source.sql"
          diff -u apps/django/schema/source.sql "${RUNNER_TEMP}/source.sql"
