name: Go Quality

on:
  push:
    branches: [main]
    paths:
      - "apps/tools/**"
      - ".github/workflows/go-quality.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/tools/**"
      - ".github/workflows/go-quality.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tools
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/tools
          sparse-checkout-cone-mode: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/tools/go.sum

      - name: Run gofmt
        run: test -z "$(gofmt -l .)"

      - name: Run deadcode
        run: go tool deadcode -test ./...

      - name: Run golint
        shell: bash
        run: |
          output="$(go tool golint ./...)"
          if [[ -n "$output" ]]; then
            printf '%s\n' "$output"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...
